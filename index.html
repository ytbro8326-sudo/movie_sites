<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStreamX — Stream HD Movies Free</title>
    <meta name="description"
        content="Watch high-definition movies online for free with multi-server streaming and instant TMDB discovery.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07070d;
            --bg2: #0d0d18;
            --bg3: #131322;
            --bg4: #1c1c30;
            --border: #1e1e35;
            --border2: #2d2d4d;
            --accent: #e50914;
            --accent-hover: #b80710;
            --accent2: #6366f1;
            --gold: #fbbf24;
            --cyan: #06b6d4;
            --text: #f1f1f7;
            --text2: #9ba1b8;
            --text3: #60667e;
            --card-r: 12px;
            --trans: .2s cubic-bezier(.4, 0, .2, 1);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        #root {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ── VIEWS ── */
        #view-home,
        #view-player {
            position: absolute;
            inset: 0;
            transition: opacity .35s ease, transform .35s ease;
        }

        #view-home {
            z-index: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #view-player {
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            transform: translateY(24px);
            display: flex;
            flex-direction: column;
        }

        #view-player.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        #view-home.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent2);
        }

        /* ══════════ NAVBAR ══════════ */
        #navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 28px;
            height: 64px;
            background: rgba(7, 7, 13, .92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px);
            flex-shrink: 0;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -.03em;
            background: linear-gradient(135deg, #ff4b4b 0%, #f97316 50%, #e50914 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo span {
            color: #fff;
            -webkit-text-fill-color: #fff;
            font-size: 11px;
            padding: 2px 7px;
            background: var(--accent);
            border-radius: 6px;
            font-weight: 900;
            letter-spacing: .05em;
        }

        /* Search */
        #search-wrap {
            flex: 1;
            max-width: 480px;
            position: relative;
        }

        #search-inp {
            width: 100%;
            padding: 10px 16px 10px 42px;
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 24px;
            color: var(--text);
            font-size: 13.5px;
            outline: none;
            transition: all var(--trans);
        }

        #search-inp::placeholder {
            color: var(--text3);
        }

        #search-inp:focus {
            border-color: var(--accent);
            background: var(--bg4);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, .2);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text3);
            pointer-events: none;
        }

        /* Search dropdown */
        #search-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .8);
            z-index: 200;
            display: none;
            max-height: 480px;
            overflow-y: auto;
        }

        #search-dropdown.show {
            display: block;
        }

        .sd-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background var(--trans);
            border-bottom: 1px solid var(--border);
        }

        .sd-item:last-child {
            border-bottom: none;
        }

        .sd-item:hover {
            background: var(--bg4);
        }

        .sd-img {
            width: 40px;
            height: 56px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background: var(--bg4);
        }

        .sd-info {
            flex: 1;
            min-width: 0;
        }

        .sd-title {
            font-size: 13.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }

        .sd-meta {
            font-size: 11px;
            color: var(--text2);
            margin-top: 3px;
            display: flex;
            gap: 8px;
        }

        .sd-score {
            font-size: 11px;
            color: var(--gold);
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--text2);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--trans);
            white-space: nowrap;
        }

        .nav-btn:hover,
        .nav-btn.active {
            border-color: var(--accent);
            background: rgba(229, 9, 20, .12);
            color: #fff;
        }

        /* ══════════ HERO SECTION ══════════ */
        #hero {
            position: relative;
            overflow: hidden;
            min-height: 480px;
            display: flex;
            align-items: flex-end;
            padding: 0 36px 48px;
            background: linear-gradient(135deg, #101020 0%, #0d0710 50%, #07070d 100%);
        }

        #hero-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center 20%;
            opacity: 0;
            transition: opacity 1s ease;
            filter: blur(0px) brightness(0.85);
        }

        #hero-bg.loaded {
            opacity: 0.38;
        }

        #hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg) 0%, rgba(7, 7, 13, .75) 45%, rgba(7, 7, 13, .3) 100%),
                linear-gradient(to right, var(--bg) 0%, rgba(7, 7, 13, .8) 40%, transparent 100%);
        }

        #hero-content {
            position: relative;
            z-index: 2;
            max-width: 620px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(229, 9, 20, .2);
            border: 1px solid rgba(229, 9, 20, .4);
            font-size: 11px;
            font-weight: 800;
            color: #ff6b6b;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        #hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(24px, 4.5vw, 42px);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 10px;
            letter-spacing: -.02em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, .8);
        }

        #hero-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .hero-tag {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 600;
            background: var(--bg4);
            color: var(--text2);
            border: 1px solid var(--border2);
        }

        .hero-score {
            color: var(--gold);
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hero-year {
            color: var(--text2);
            font-size: 12.5px;
            font-weight: 600;
        }

        #hero-desc {
            font-size: 14px;
            color: #c4c8dc;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 22px;
            max-width: 540px;
        }

        #hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 26px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--trans);
        }

        .hero-btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 8px 25px rgba(229, 9, 20, .35);
        }

        .hero-btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(229, 9, 20, .5);
        }

        .hero-btn-secondary {
            background: rgba(255, 255, 255, .1);
            color: var(--text);
            border: 1px solid var(--border2);
            backdrop-filter: blur(8px);
        }

        .hero-btn-secondary:hover {
            background: rgba(255, 255, 255, .16);
            transform: translateY(-2px);
        }

        /* ══════════ GENRE & FILTER BAR ══════════ */
        #genre-bar {
            display: flex;
            gap: 8px;
            padding: 20px 28px;
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
        }

        #genre-bar::-webkit-scrollbar {
            display: none;
        }

        .genre-pill {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid var(--border2);
            background: var(--bg3);
            color: var(--text2);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--trans);
            flex-shrink: 0;
        }

        .genre-pill:hover,
        .genre-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(229, 9, 20, .3);
        }

        /* ══════════ MOVIE GRIDS & CAROUSELS ══════════ */
        .section {
            padding: 32px 28px 8px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        .see-all {
            font-size: 12.5px;
            color: var(--accent2);
            font-weight: 600;
            cursor: pointer;
            transition: color var(--trans);
        }

        .see-all:hover {
            color: #fff;
        }

        .h-scroll-wrap {
            overflow-x: auto;
            padding: 0 28px 24px;
            scrollbar-width: none;
        }

        .h-scroll-wrap::-webkit-scrollbar {
            display: none;
        }

        .h-scroll {
            display: flex;
            gap: 16px;
        }

        .h-scroll .movie-card {
            flex-shrink: 0;
            width: 155px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 18px;
        }

        .movie-card {
            cursor: pointer;
            transition: transform var(--trans);
            border-radius: var(--card-r);
            overflow: hidden;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-6px);
        }

        .card-poster {
            position: relative;
            padding-top: 150%;
            background: var(--bg3);
            overflow: hidden;
            border-radius: var(--card-r);
        }

        .card-poster img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .4s ease;
        }

        .movie-card:hover .card-poster img {
            transform: scale(1.08);
        }

        .card-score {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, .8);
            backdrop-filter: blur(6px);
            color: var(--gold);
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-quality {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(229, 9, 20, .9);
            color: #fff;
            font-size: 9px;
            font-weight: 900;
            padding: 3px 6px;
            border-radius: 5px;
            letter-spacing: .05em;
        }

        .card-year {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, .8);
            backdrop-filter: blur(6px);
            color: var(--text2);
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(7, 7, 13, .95) 0%, rgba(7, 7, 13, .3) 60%, transparent 100%);
            opacity: 0;
            transition: opacity .25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movie-card:hover .card-overlay {
            opacity: 1;
        }

        .play-btn-circle {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(229, 9, 20, .6);
            transform: scale(.8);
            transition: transform .25s ease;
        }

        .movie-card:hover .play-btn-circle {
            transform: scale(1);
        }

        .card-info {
            padding: 10px 4px 4px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text);
        }

        .card-sub {
            font-size: 11px;
            color: var(--text2);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* ══════════ PLAYER VIEW ══════════ */
        #player-topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            height: 60px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        #back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border2);
            background: var(--bg3);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--trans);
            white-space: nowrap;
            flex-shrink: 0;
        }

        #back-btn:hover {
            border-color: var(--accent);
            background: var(--bg4);
            color: var(--accent);
        }

        #player-movie-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        #player-title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }

        #player-meta-badge {
            font-size: 11.5px;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--bg4);
            color: var(--text2);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Server selector */
        #server-selector-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .server-label {
            font-size: 11px;
            color: var(--text3);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        #server-select {
            padding: 8px 14px;
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 10px;
            color: var(--text);
            font-size: 12.5px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: border-color var(--trans);
        }

        #server-select:focus {
            border-color: var(--accent);
        }

        #player-main {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #player-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Details & Recommendations below player */
        #player-details-row {
            padding: 24px 28px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            max-height: 280px;
            overflow-y: auto;
        }

        .player-info-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .player-info-overview {
            font-size: 13.5px;
            color: var(--text2);
            line-height: 1.6;
            margin-bottom: 16px;
            max-width: 900px;
        }

        /* Loading Spinner */
        .loading-spin {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ══════════ RESPONSIVE — TABLET ══════════ */
        @media (max-width: 900px) {
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 14px;
            }

            .h-scroll .movie-card {
                width: 145px;
            }
        }

        /* ══════════ PLAYER MOBILE HEIGHT FIX ══════════ */
        @media (max-width: 768px) {
            #view-player {
                overflow-y: auto;
                overflow-x: hidden;
            }

            #player-main {
                flex-shrink: 0;
                height: 56vw;
                min-height: 200px;
                max-height: 340px;
                position: relative;
            }

            #player-frame,
            #player-video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
        }

        /* ══════════ RESPONSIVE — MOBILE ══════════ */
        @media (max-width: 768px) {

            /* Navbar */
            #navbar {
                padding: 0 12px;
                height: auto;
                min-height: 56px;
                flex-wrap: wrap;
                gap: 8px;
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .logo {
                font-size: 17px;
                flex-shrink: 0;
            }

            #search-wrap {
                order: 3;
                flex: 1 1 100%;
                max-width: 100%;
            }

            .nav-links {
                order: 2;
                overflow-x: auto;
                scrollbar-width: none;
                gap: 6px;
                flex-wrap: nowrap;
                width: 100%;
            }

            .nav-links::-webkit-scrollbar {
                display: none;
            }

            .nav-btn {
                padding: 5px 11px;
                font-size: 11px;
                flex-shrink: 0;
            }

            #search-inp {
                font-size: 13px;
                padding: 9px 14px 9px 38px;
            }

            #search-dropdown {
                max-height: 320px;
            }

            /* Hero */
            #hero {
                padding: 0 14px 28px;
                min-height: 300px;
                align-items: flex-end;
            }

            #hero-title {
                font-size: 20px;
                line-height: 1.2;
            }

            #hero-desc {
                font-size: 12px;
                -webkit-line-clamp: 2;
                margin-bottom: 14px;
            }

            #hero-meta {
                gap: 8px;
                margin-bottom: 10px;
            }

            .hero-score {
                font-size: 12px;
            }

            .hero-tag,
            .hero-year {
                font-size: 10.5px;
            }

            #hero-actions {
                gap: 8px;
            }

            .hero-btn {
                padding: 10px 18px;
                font-size: 12.5px;
                gap: 6px;
                border-radius: 10px;
            }

            .hero-badge {
                font-size: 10px;
                padding: 4px 10px;
                margin-bottom: 10px;
            }

            /* Genre bar */
            #genre-bar {
                padding: 10px 12px;
                gap: 6px;
            }

            .genre-pill {
                padding: 6px 13px;
                font-size: 11.5px;
            }

            /* Sections */
            .section {
                padding: 18px 12px 2px;
            }

            .section-title {
                font-size: 16px;
            }

            .see-all {
                font-size: 12px;
            }

            .h-scroll-wrap {
                padding: 0 12px 16px;
            }

            .h-scroll {
                gap: 10px;
            }

        const dbBySerial = new Map();

        async function loadCustomDatabase() {
            if (customDbLoaded) return true;
            if (dbLoadingPromise) return dbLoadingPromise;

            dbLoadingPromise = (async () => {
                const candidatePaths = [
                    "https://raw.githubusercontent.com/ytbro8326-sudo/primesrc_single_flaresolver/refs/heads/main/custom_merged_data.json",
                    "https://cdn.jsdelivr.net/gh/ytbro8326-sudo/primesrc_single_flaresolver@main/custom_merged_data.json",
                    "../custom_merged_data.json",
                    "./custom_merged_data.json",
                    "custom_merged_data.json"
                ];

                for (const path of candidatePaths) {
                    try {
                        const res = await fetch(path);
                        if (!res.ok) continue;
                        const data = await res.json();
                        if (Array.isArray(data) && data.length > 0) {
                            data.forEach(item => {
                                if (!item) return;
                                const ti = String(item["tmdb/imdb"] || "").trim();
                                const parts = ti.split("/");
                                const p0 = (parts[0] || "").trim();
                                const p1 = (parts[1] || "").trim().toLowerCase();

                                if (p0.startsWith("tt")) {
                                    dbByImdb.set(p0.toLowerCase(), item);
                                } else if (p0) {
                                    dbByTmdb.set(p0, item);
                                }

                                if (p1.startsWith("tt")) {
                                    dbByImdb.set(p1.toLowerCase(), item);
                                } else if (p1) {
                                    dbByTmdb.set(p1, item);
                                }

                                if (item.serial) {

                                }
                            });
                            customDbLoaded = true;

                }
                return false;

            if (!url) return url;
            let videoId = "";
            if (url.includes("/embed/")) {
                videoId = url.split("/embed/")[1].split("?")[0].split("&")[0].split("/")[0];
            } else if (url.includes("watch?v=")) {
                try {
                    const urlObj = new URL(url);
                    videoId = urlObj.searchParams.get("v") || "";
                } catch (e) {
                    videoId = url.split("watch?v=")[1].split("&")[0];
                }
            } else if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1].split("?")[0].split("&")[0].split("/")[0];
            }
            return videoId ? `https://www.youtube.com/embed/${videoId}` : url;

        function scoreVidKingLabel(label) {

            if (l.includes("480p") && l.includes("proxy")) return 60;
            // Priority 7: Lamovie / Vimeos proxy
            if (l.includes("lamovie") || l.includes("vimeos")) return 50;
            return 10;
        }

        async function fetchVidKingStreams(tmdbId) {
            try {
                const apiBase = getNextVidKingApi();
                const res = await fetch(`${apiBase}/${tmdbId}`);
                if (!res.ok) return [];
                const data = await res.json();
                if (data && data.success && Array.isArray(data.results) && data.results.length > 0) {
                    // Sort streams based on master first, then 1080p proxy, etc.
                    return data.results.sort((a, b) => scoreVidKingLabel(b.label) - scoreVidKingLabel(a.label));
                }
                return [];
            } catch (err) {
                console.warn("VidKing API error:", err);
                return [];
            }
        }

        function showStreamStatus(msg, duration = 3000) {
            const el = document.getElementById('stream-status');
            if (!el) return;
            el.textContent = msg;
            el.style.display = 'block';
            if (duration > 0) {
                setTimeout(() => { el.style.display = 'none'; }, duration);
            }
        }

        function stopVideoPlayback() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            const video = document.getElementById('player-video');
            if (video) {
                video.pause();
                video.removeAttribute('src');
                video.load();
                video.style.display = 'none';
            }
            const qSelect = document.getElementById('vidking-quality-select');
            if (qSelect) qSelect.style.display = 'none';
        }

        async function playVidKingHLS(tmdbId, specificUrl = null) {
            const frame = document.getElementById('player-frame');
            const video = document.getElementById('player-video');
            const qSelect = document.getElementById('vidking-quality-select');

            // Hide iframe and show video tag
            frame.style.display = 'none';
            frame.src = 'about:blank';
            video.style.display = 'block';

            showStreamStatus("Fetching VidKing HD streams…", 0);

            if (!specificUrl) {
                currentVidKingStreams = await fetchVidKingStreams(tmdbId);
            }

            if (!currentVidKingStreams || currentVidKingStreams.length === 0) {
                showStreamStatus("VidKing stream not found, switching to VOE Player…", 3000);
                video.style.display = 'none';
                frame.style.display = 'block';
                frame.src = SERVER_PROVIDERS['voe_worker'](tmdbId);
                return;
            }

            // Populate Quality Selector
            qSelect.innerHTML = currentVidKingStreams.map((s, idx) => `
                <option value="${encodeURIComponent(s.url)}" ${idx === 0 && !specificUrl ? 'selected' : (specificUrl === s.url ? 'selected' : '')}>
                    ${s.label}
                </option>
            `).join('');
            qSelect.style.display = 'block';

            // Sequential stream playback attempt
            let streamIndex = specificUrl ? currentVidKingStreams.findIndex(s => s.url === specificUrl) : 0;
            if (streamIndex < 0) streamIndex = 0;

            function tryStream(index) {
                if (index >= currentVidKingStreams.length) {
                    showStreamStatus("All VidKing streams failed, falling back to VOE…", 3000);
                    video.style.display = 'none';
                    frame.style.display = 'block';
                    frame.src = SERVER_PROVIDERS['voe_worker'](tmdbId);
                    return;
                }

                const stream = currentVidKingStreams[index];
                showStreamStatus(`Playing: ${stream.label}`, 2500);

                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }

                if (Hls.isSupported()) {
                    hlsInstance = new Hls({
                        enableWorker: true,
                        lowLatencyMode: false,
                        backBufferLength: 90
                    });

                    hlsInstance.loadSource(stream.url);
                    hlsInstance.attachMedia(video);

                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(() => { });
                    });

                    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            console.warn(`HLS fatal error on stream [${stream.label}]:`, data);
                            hlsInstance.destroy();
                            hlsInstance = null;
                            showStreamStatus(`Stream error on ${stream.label}, trying next…`, 2000);
                            tryStream(index + 1);
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Native Safari HLS
                    video.src = stream.url;
                    video.addEventListener('loadedmetadata', () => {
                        video.play().catch(() => { });
                    }, { once: true });
                    video.addEventListener('error', () => {
                        showStreamStatus(`Stream error on ${stream.label}, trying next…`, 2000);
                        tryStream(index + 1);
                    }, { once: true });
                }
            }

            tryStream(streamIndex);
        }

        function switchVidkingQuality(encodedUrl) {
            const url = decodeURIComponent(encodedUrl);
            if (currentMovie) {
                playVidKingHLS(currentMovie.id, url);
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  TMDB API REQUEST HELPER
        // ═══════════════════════════════════════════════════════════
        async function fetchTMDB(endpoint, params = {}) {
            const queryParams = new URLSearchParams({
                api_key: TMDB_KEY,
                language: 'en-US',
                ...params
            });
            try {
                const res = await fetch(`${TMDB_BASE}${endpoint}?${queryParams.toString()}`);
                if (!res.ok) throw new Error(`TMDB error HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.error("TMDB Fetch Error:", err);
                return null;
            }
        }

        // ── Horizontal Movie Carousel ──

            const container = document.getElementById(elementId);
            container.innerHTML = `<div style="padding:20px; color:var(--text3);"><div class="loading-spin"></div></div>`;

            const data = await fetchTMDB(endpoint, params);

                container.innerHTML = `<div style="color:var(--text3); padding:10px;">Failed to load movies.</div>`;

            container.innerHTML = data.results.slice(0, 15).map(m => createMovieCardHTML(m)).join('');

        // ── Main Movie Grid ──
        async function loadMovieGrid(endpoint, params) {
            const grid = document.getElementById('popular-grid');
            grid.innerHTML = `<div style="padding:20px; color:var(--text3);"><div class="loading-spin"></div></div>`;

            const data = await fetchTMDB(endpoint, params);
            if (!data || !data.results) {
                grid.innerHTML = `<div style="color:var(--text3); padding:10px;">No movies found.</div>`;

        // ── Movie Card HTML ──

                <div class="movie-card" onclick="playMovie(${movie.id})">
                    <div class="card-poster">
                        <img src="${poster}" alt="${title}" loading="lazy">
                        <div class="card-score">★ ${score}</div>
                        <div class="card-quality">HD</div>
                        <div class="card-year">${year}</div>
                        <div class="card-overlay">
                            <div class="play-btn-circle">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff">

                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${movie.title || movie.original_title}</div>

        // ═══════════════════════════════════════════════════════════
        //  SEARCH
        // ═══════════════════════════════════════════════════════════
        function setupSearch() {
            const input = document.getElementById('search-inp');
            const dropdown = document.getElementById('search-dropdown');
            let debounceTimer = null;

            input.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                const query = input.value.trim();

                if (!query) {
                    dropdown.classList.remove('show');
                    dropdown.innerHTML = '';
                    return;
                }

                debounceTimer = setTimeout(async () => {
                    const data = await fetchTMDB('/search/movie', { query });
                    if (!data || !data.results || data.results.length === 0) {
                        dropdown.innerHTML = `<div style="padding:14px; color:var(--text3); font-size:13px;">No movies found for "${query}"</div>`;
                        dropdown.classList.add('show');
                        return;
                    }

                    dropdown.innerHTML = data.results.slice(0, 8).map(m => {
                        const poster = m.poster_path ? `${TMDB_IMG_W342}${m.poster_path}` : 'https://via.placeholder.com/342x513?text=No+Poster';
                        const year = (m.release_date || '').split('-')[0] || 'N/A';
                        const score = m.vote_average ? m.vote_average.toFixed(1) : 'NR';
                        const dbMatch = dbByTmdb.get(String(m.id));
                        let dbBadge = '';
                        if (dbMatch) {
                            const dInfo = detectServerFromDbItem(dbMatch);
                            dbBadge = `<span style="background:rgba(229,9,20,0.22); color:var(--accent); font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:6px; border:1px solid rgba(229,9,20,0.35);">⚡ ${dInfo ? dInfo.label : 'DB Stream'}</span>`;
                        }
                        return `
                            <div class="sd-item" onclick="playMovie(${m.id}); document.getElementById('search-dropdown').classList.remove('show');">
                                <img class="sd-img" src="${poster}" alt="${m.title}">
                                <div class="sd-info">
                                    <div class="sd-title">${m.title} ${dbBadge}</div>
                                    <div class="sd-meta">
                                        <span>${year}</span>
                                        <span class="sd-score">★ ${score}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                    dropdown.classList.add('show');
                }, 300);
            });

            document.addEventListener('click', (e) => {
                if (!document.getElementById('search-wrap').contains(e.target)) {
                    dropdown.classList.remove('show');
                }
            });
        }

        // ═══════════════════════════════════════════════════════════
        //  MOVIE STREAMING PLAYER
        // ═══════════════════════════════════════════════════════════
        async function playMovie(tmdbId) {
            // 1. Ensure custom database is ready first
            await loadCustomDatabase();

            const tmdbStr = String(tmdbId);
            let matchedItem = dbByTmdb.get(tmdbStr);

            // 2. Fetch movie metadata from TMDB with fallback
            let movie = await fetchTMDB(`/movie/${tmdbId}`, { append_to_response: 'external_ids' });
            if (!movie) {
                movie = {
                    id: tmdbId,
                    title: matchedItem ? matchedItem.title : `Movie #${tmdbId}`,
                    original_title: matchedItem ? matchedItem.title : `Movie #${tmdbId}`,
                    overview: "Streaming high definition media directly from database stream servers.",
                    release_date: "",
                    vote_average: 7.5
                };
            }

            currentMovie = movie;

            // Set Top Bar info
            const title = movie.title || movie.original_title || (matchedItem ? matchedItem.title : 'Movie');
            document.getElementById('player-title').textContent = title;
            const year = (movie.release_date || '').split('-')[0] || '';
            const runtime = movie.runtime ? `${movie.runtime}m` : 'HD';
            document.getElementById('player-meta-badge').textContent = `${year} • ${runtime} • ★ ${(movie.vote_average || 0).toFixed(1)}`;

            // Set Overview & Info
            document.getElementById('p-info-title').textContent = `${title} ${year ? '(' + year + ')' : ''}`;
            document.getElementById('p-info-overview').textContent = movie.overview || "No overview available for this movie.";

            // ── Match TMDB / IMDb ID in custom database ──
            const imdbStr = (movie.imdb_id || (movie.external_ids && movie.external_ids.imdb_id) || '').trim().toLowerCase();

            if (!matchedItem && imdbStr) {
                matchedItem = dbByImdb.get(imdbStr);
            }

            let targetServer = currentServer;
            let detectedInfo = null;

            if (matchedItem) {
                detectedInfo = detectServerFromDbItem(matchedItem);
                if (detectedInfo) {
                    targetServer = detectedInfo.serverKey;
                    currentServer = targetServer;
                    const selectEl = document.getElementById('server-select');
                    if (selectEl) {
                        selectEl.value = targetServer;
                    }
                    showStreamStatus(`⚡ Database Match: [${detectedInfo.label}] — Auto Extracting & Playing…`, 4000);
                }
            } else {
                showStreamStatus(`Playing stream via ${currentServer.replace('_', ' ').toUpperCase()}…`, 2000);
            }

            // Load iframe server embed or stream
            await updatePlayerIframe(movie, targetServer, detectedInfo);

            // Load Collection Movies
            const collectionContainer = document.getElementById('player-collection-container');
            const collectionRow = document.getElementById('player-collection-row');
            if (movie.belongs_to_collection) {
                document.getElementById('p-collection-title').innerHTML = `<span class="dot" style="background:var(--gold)"></span> ${movie.belongs_to_collection.name}`;
                collectionContainer.style.display = 'block';
                collectionRow.innerHTML = `<div style="padding:20px; color:var(--text3);"><div class="loading-spin"></div></div>`;
                fetchTMDB(`/collection/${movie.belongs_to_collection.id}`).then(collData => {
                    if (collData && collData.parts && collData.parts.length > 0) {
                        // Sort by release date for correct order
                        const sortedParts = collData.parts.sort((a, b) => new Date(a.release_date) - new Date(b.release_date));
                        collectionRow.innerHTML = sortedParts.map(m => createMovieCardHTML(m)).join('');
                    } else {
                        collectionContainer.style.display = 'none';
                    }
                });
            } else {
                collectionContainer.style.display = 'none';
                collectionRow.innerHTML = '';
            }

            // Load Similar Movies
            loadHorizontalList(`/movie/${tmdbId}/similar`, {}, 'player-similar-row');

            // Switch View
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-player').classList.add('active');
        }

        async function updatePlayerIframe(movieOrId, serverKey, detectedDbInfo = null) {
            const tmdbId = typeof movieOrId === 'object' ? movieOrId.id : movieOrId;
            let imdbId = typeof movieOrId === 'object' ? (movieOrId.imdb_id || (movieOrId.external_ids && movieOrId.external_ids.imdb_id)) : null;

            const frame = document.getElementById('player-frame');

            // 1. VidKing HLS Direct Player
            if (serverKey === 'vidking') {
                await playVidKingHLS(tmdbId);
                return;
            }

            // Stop any active HLS video playback when switching to iframe server
            stopVideoPlayback();
            frame.style.display = 'block';

            // Reset standard frame attributes
            frame.removeAttribute('sandbox');
            frame.removeAttribute('referrerpolicy');
            frame.setAttribute('title', 'Movie Player');
            frame.setAttribute('frameborder', '0');
            frame.setAttribute('allowfullscreen', 'true');
            frame.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');

            // 2. YouTube Embed handling with exact required parameters
            const isYouTube = serverKey === 'youtube' || 
                              (detectedDbInfo && (detectedDbInfo.domain === 'youtube.com' || detectedDbInfo.serverKey === 'youtube')) ||
                              (detectedDbInfo && detectedDbInfo.rawUrl && (detectedDbInfo.rawUrl.includes('youtube.com') || detectedDbInfo.rawUrl.includes('youtu.be')));

            if (isYouTube && detectedDbInfo && detectedDbInfo.rawUrl) {
                const embedUrl = formatYouTubeEmbedUrl(detectedDbInfo.rawUrl);
                frame.removeAttribute('sandbox');
                frame.setAttribute('title', 'YouTube video player');
                frame.setAttribute('frameborder', '0');
                frame.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
                frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
                frame.setAttribute('allowfullscreen', 'true');
                frame.src = embedUrl;
                showStreamStatus('▶ Playing YouTube Stream', 3000);
                return;
            }

            // 3. VidMoly & Vidzee Adblocking Sandbox handling
            const isVidmoly = serverKey === 'vidmoly' || 
                              (detectedDbInfo && (detectedDbInfo.domain === 'vidmoly.biz' || detectedDbInfo.serverKey === 'vidmoly')) ||
                              (detectedDbInfo && detectedDbInfo.rawUrl && detectedDbInfo.rawUrl.includes('vidmoly.'));
            
            const isVidzee = serverKey === 'vidzee';

            if (isVidmoly || isVidzee) {
                // Apply strict adblocking sandbox to block popup ads, redirects, and intrusive ad scripts
                frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
                frame.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');

                if (isVidmoly && detectedDbInfo && detectedDbInfo.rawUrl) {
                    frame.src = detectedDbInfo.rawUrl;
                    showStreamStatus('🛡️ VidMoly Stream (Ad-Shield Active)', 3000);
                    return;
                } else if (isVidzee) {
                    const url = SERVER_PROVIDERS['vidzee'](tmdbId);
                    frame.src = url;
                    showStreamStatus('🛡️ Vidzee Player (Ad-Shield Active)', 3000);
                    return;
                }
            }

            // 4. Direct Embeds (VidNest, StreamPlay, Upzur, Vimeo, Dailymotion, Archive.org, SaveFiles, etc.)
            const isDirectEmbed = serverKey === 'direct_embed' ||
                                  serverKey === 'vidnest' ||
                                  serverKey === 'streamplay' ||
                                  serverKey === 'upzur' ||
                                  (detectedDbInfo && ['vidnest.io', 'streamplay.to', 'upzur.com', 'dailymotion.com', 'vimeo.com', 'archive.org', 'savefiles.com'].includes(detectedDbInfo.domain));

            if (isDirectEmbed && detectedDbInfo && detectedDbInfo.rawUrl) {
                frame.src = detectedDbInfo.rawUrl;
                showStreamStatus(`▶ Playing ${detectedDbInfo.label || 'Stream'}`, 3000);
                return;
            }

            // 5. IMDb-based servers
            if (serverKey === 'insertunit' || serverKey === 'gemma') {
                // Convert TMDB ID to IMDb ID specifically for IMDb-based servers
                if (!imdbId) {
                    const extData = await fetchTMDB(`/movie/${tmdbId}/external_ids`);
                    imdbId = extData ? extData.imdb_id : null;
                    if (currentMovie && typeof currentMovie === 'object') {
                        currentMovie.imdb_id = imdbId;
                    }
                }

                if (imdbId) {
                    if (serverKey === 'gemma') {
                        frame.src = `https://gemma416okl.com/play/${imdbId}`;
                    } else {
                        frame.src = `https://api.insertunit.ws/embed/imdb/${imdbId}`;
                    }
                } else {
                    console.warn(`No IMDb ID found for TMDB ${tmdbId}, falling back to PrimeSrc`);
                    frame.src = `https://primesrc.me/embed/movie?tmdb=${tmdbId}`;
                }
                return;
            }

            // 6. TMDB & DB Direct Server URL Providers
            const provider = SERVER_PROVIDERS[serverKey] || SERVER_PROVIDERS['voe_worker'] || SERVER_PROVIDERS['primesrc'];
            const url = provider(tmdbId, imdbId);
            frame.src = url;
        }

        async function changeServer(serverKey) {
            currentServer = serverKey;
            if (currentMovie) {
                let detectedInfo = null;
                const tmdbStr = String(currentMovie.id);
                let matchedItem = dbByTmdb.get(tmdbStr);
                const imdbStr = (currentMovie.imdb_id || (currentMovie.external_ids && currentMovie.external_ids.imdb_id) || '').trim().toLowerCase();
                if (!matchedItem && imdbStr) {
                    matchedItem = dbByImdb.get(imdbStr);
                }
                if (matchedItem) {
                    detectedInfo = detectServerFromDbItem(matchedItem);
                }
                await updatePlayerIframe(currentMovie, currentServer, detectedInfo);
            }
        }

        function closePlayer() {
            stopVideoPlayback();
            const frame = document.getElementById('player-frame');
            frame.src = 'about:blank'; // Stop video stream
            document.getElementById('view-player').classList.remove('active');
            document.getElementById('view-home').classList.remove('hidden');
        }

        function goHome() {
            closePlayer();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('DOMContentLoaded', initHome);
